<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Brides and editorial portraits with make-up by Linh, in Paris.">

  <link rel="alternate" hreflang="en" href="https://geksmode.github.io/maisondelyn/en/galerie.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gallery · Maison de Lyn">
  <meta property="og:description" content="Brides and editorial portraits with make-up by Linh, in Paris.">
  <meta property="og:image" content="https://geksmode.github.io/maisondelyn/img/mariee-fenetre.jpg">
  <meta property="og:url" content="https://geksmode.github.io/maisondelyn/en/galerie.html">
  <meta property="og:locale" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">

</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">Maison de Lyn</a>
    <nav>
        <a href="prestations.html">Services</a>
        <a href="galerie.html" aria-current="page">Gallery</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
      <a class="switch" href="../galerie.html" hreflang="fr" lang="fr" title="Français">FR</a>
    </nav>
  </header>

  <main>
    <section class="page wide">
      <h1>Brides</h1>
      <div class="grid landscape">
        <img class="reveal" data-lightbox src="../img/mariee-damas.jpg" alt="" loading="lazy">
        <img class="reveal" data-lightbox src="../img/mariee-fenetre.jpg" alt="" loading="lazy">
        <img class="reveal" data-lightbox src="../img/mariee-tableau.jpg" alt="" loading="lazy">
        <img class="reveal" data-lightbox src="../img/mariee-polaroid.jpg" alt="" loading="lazy">
        <img class="reveal" data-lightbox src="../img/couple.jpg" alt="" loading="lazy">
      </div>
      <h1 class="second">Editorial</h1>
      <div class="grid portrait">
        <img class="reveal" data-lightbox src="../img/boucles.jpg" alt="" loading="lazy">
        <img class="reveal" data-lightbox src="../img/naturel.jpg" alt="" loading="lazy">
        <img class="reveal" data-lightbox src="../img/robe-blanche.jpg" alt="" loading="lazy">
        <img class="reveal" data-lightbox src="../img/tweed.jpg" alt="" loading="lazy">
        <img class="reveal" data-lightbox src="../img/tweed-2.jpg" alt="" loading="lazy">
      </div>
      <a class="more" href="https://www.instagram.com/maisondelyn_mua/">More on Instagram</a>
    </section>
  </main>

  <footer class="bottom">
    <span>Maison de Lyn · Bridal make-up, Paris</span>
    <a href="https://www.instagram.com/maisondelyn_mua/">Instagram</a>
  </footer>
  <dialog class="lightbox" aria-label="Photo">
    <img alt="">
    <button class="lb-close" aria-label="Close">×</button>
    <button class="lb-prev" aria-label="Previous photo">‹</button>
    <button class="lb-next" aria-label="Next photo">›</button>
    <p class="lb-count"></p>
  </dialog>
  <script>
    const shots = [...document.querySelectorAll('[data-lightbox]')], lb = document.querySelector('.lightbox');
    if (shots.length && lb.showModal) {
      const big = lb.querySelector('img'), count = lb.querySelector('.lb-count');
      let i = 0, x0 = null;
      const show = (k) => { i = (k + shots.length) % shots.length; big.src = shots[i].currentSrc || shots[i].src; big.alt = shots[i].alt; count.textContent = (i + 1) + ' / ' + shots.length; };
      shots.forEach((el, k) => { el.addEventListener('click', () => { show(k); lb.showModal(); }); });
      lb.querySelector('.lb-close').onclick = () => lb.close();
      lb.querySelector('.lb-prev').onclick = () => show(i - 1);
      lb.querySelector('.lb-next').onclick = () => show(i + 1);
      lb.addEventListener('click', (e) => { if (e.target === lb) lb.close(); });
      lb.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1); });
      lb.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1); x0 = null; });
    }
    const io = 'IntersectionObserver' in window && new IntersectionObserver((es) => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { threshold: .15 });
    document.querySelectorAll('.reveal').forEach(el => io ? io.observe(el) : el.classList.add('in'));
  </script>
</body>
</html>
