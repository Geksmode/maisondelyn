<body>
  <header class="top">
    <a class="brand" href="index.html">Maison de Lyn</a>
    <nav>
        <a href="prestations.html">Prestations</a>
        <a href="galerie.html">Galerie</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html" aria-current="page">Contact</a>
      <a class="switch" href="en/contact.html" hreflang="en" lang="en" title="English">EN</a>
    </nav>
  </header>

  <main>
    <section class="page">
      <h1>Contact</h1>
      <p class="lead">Parlez-moi de votre mariage. Je vous réponds sous 48 h avec mes disponibilités et un devis.</p>
      <!-- Remplacer VOTRE_ID par l'identifiant Formspree (formspree.io) pour recevoir les demandes par e-mail. -->
      <lyn-quote-form data-wip="Le formulaire sera actif très bientôt. En attendant, écrivez-moi sur Instagram." data-ok="Merci, votre demande est bien arrivée. Je vous réponds sous 48 h." data-err="L'envoi n'a pas fonctionné. Réessayez ou écrivez-moi sur Instagram.">
      <form id="devis" class="reveal" action="https://formspree.io/f/VOTRE_ID" method="POST">
        <input type="hidden" name="langue" value="fr">
        <label>Nom<input name="nom" required autocomplete="name"></label>
        <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
        <label>Téléphone<input name="telephone" type="tel" required autocomplete="tel"></label>
        <label>Date du mariage<input name="date" type="date" required></label>
        <label>Ville de préparation<input name="lieu" required></label>
        <label>Nombre de personnes à maquiller<input name="personnes" type="number" min="1" value="1" required></label>
        <label>Prestation<select name="prestation"><option value="mariee">Mariée</option><option value="proches">Proches seulement</option><option value="evenement">Événement ou shooting</option><option value="planner">Je suis wedding planner</option></select></label>
        <label>Style souhaité<select name="style"><option>Je ne sais pas encore</option><option>Naturel</option><option>Sophistiqué</option><option>Glamour</option></select></label>
        <label class="full">Votre message<textarea name="message" rows="3"></textarea></label>
        <button class="btn" type="submit"><span>Envoyer</span><svg aria-hidden="true" width="18" height="10" viewBox="0 0 18 10"><path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <p class="status" role="status" aria-live="polite"></p>
      </form>
      </lyn-quote-form>
      <a class="btn ghost" href="https://www.instagram.com/maisondelyn_mua/"><span>Ou sur Instagram</span><svg aria-hidden="true" width="18" height="10" viewBox="0 0 18 10"><path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a>
    </section>
  </main>

  <footer class="bottom">
    <span>Maison de Lyn · Maquillage de mariée, Paris</span>
    <a href="https://www.instagram.com/maisondelyn_mua/">Instagram</a>
  </footer>
  <lyn-lightbox label-close="Fermer" label-prev="Photo précédente" label-next="Photo suivante"></lyn-lightbox>
  <script type="module" src="components.js"></script>
</body>
</html>
