<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Maison de Lyn</title>
  <meta name="description" content="Demandez un devis pour votre maquillage de mariée à Paris : réponse sous 48 h.">
  <link rel="alternate" hreflang="fr" href="https://geksmode.github.io/maisondelyn/contact.html">
  <link rel="alternate" hreflang="en" href="https://geksmode.github.io/maisondelyn/en/contact.html">
  <link rel="alternate" hreflang="x-default" href="https://geksmode.github.io/maisondelyn/contact.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact · Maison de Lyn">
  <meta property="og:description" content="Demandez un devis pour votre maquillage de mariée à Paris : réponse sous 48 h.">
  <meta property="og:image" content="https://geksmode.github.io/maisondelyn/img/mariee-fenetre.jpg">
  <meta property="og:url" content="https://geksmode.github.io/maisondelyn/contact.html">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">Maison de Lyn</a>
    <nav>
        <a href="prestations.html">Prestations</a>
        <a href="galerie.html">Galerie</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html" aria-current="page">Contact</a>
      <a class="switch" href="en/contact.html" hreflang="en" lang="en" title="English">EN</a>
    </nav>
  </header>

  <main>
    <section class="page">
      <h1>Contact</h1>
      <p class="lead">Parlez-moi de votre mariage. Je vous réponds sous 48 h avec mes disponibilités et un devis.</p>
      <!-- Remplacer VOTRE_ID par l'identifiant Formspree (formspree.io) pour recevoir les demandes par e-mail. -->
      <form id="devis" class="reveal" action="https://formspree.io/f/VOTRE_ID" method="POST">
        <input type="hidden" name="langue" value="fr">
        <label>Nom<input name="nom" required autocomplete="name"></label>
        <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
        <label>Téléphone<input name="telephone" type="tel" required autocomplete="tel"></label>
        <label>Date du mariage<input name="date" type="date" required></label>
        <label>Ville de préparation<input name="lieu" required></label>
        <label>Nombre de personnes à maquiller<input name="personnes" type="number" min="1" value="1" required></label>
        <label>Prestation<select name="prestation"><option value="mariee">Mariée</option><option value="proches">Proches seulement</option><option value="evenement">Événement ou shooting</option><option value="planner">Je suis wedding planner</option></select></label>
        <label>Style souhaité<select name="style"><option>Je ne sais pas encore</option><option>Naturel</option><option>Sophistiqué</option><option>Glamour</option></select></label>
        <label class="full">Votre message<textarea name="message" rows="4"></textarea></label>
        <button type="submit">Envoyer</button>
        <p class="status" role="status" aria-live="polite"></p>
      </form>
      <a class="more" href="https://www.instagram.com/maisondelyn_mua/">Ou sur Instagram</a>
    </section>
  </main>

  <footer class="bottom">
    <span>Maison de Lyn · Maquillage de mariée, Paris</span>
    <a href="https://www.instagram.com/maisondelyn_mua/">Instagram</a>
  </footer>
  <dialog class="lightbox" aria-label="Photo">
    <img alt="">
    <button class="lb-close" aria-label="Fermer">×</button>
    <button class="lb-prev" aria-label="Photo précédente">‹</button>
    <button class="lb-next" aria-label="Photo suivante">›</button>
    <p class="lb-count"></p>
  </dialog>
  <script>
    const form = document.getElementById('devis'), status = form.querySelector('.status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (form.action.includes('VOTRE_ID')) { status.textContent = "Le formulaire sera actif très bientôt. En attendant, écrivez-moi sur Instagram."; return; }
      try {
        const r = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
        if (!r.ok) throw new Error();
        form.reset();
        status.textContent = "Merci, votre demande est bien arrivée. Je vous réponds sous 48 h.";
      } catch { status.textContent = "L'envoi n'a pas fonctionné. Réessayez ou écrivez-moi sur Instagram."; }
    });
  </script>
  <script>
    const shots = [...document.querySelectorAll('[data-lightbox]')], lb = document.querySelector('.lightbox');
    if (shots.length && lb.showModal) {
      const big = lb.querySelector('img'), count = lb.querySelector('.lb-count');
      let i = 0, x0 = null;
      const show = (k) => { i = (k + shots.length) % shots.length; big.src = shots[i].currentSrc || shots[i].src; big.alt = shots[i].alt; count.textContent = (i + 1) + ' / ' + shots.length; };
      shots.forEach((el, k) => { el.addEventListener('click', () => { show(k); lb.showModal(); }); });
      lb.querySelector('.lb-close').onclick = () => lb.close();
      lb.querySelector('.lb-prev').onclick = () => show(i - 1);
      lb.querySelector('.lb-next').onclick = () => show(i + 1);
      lb.addEventListener('click', (e) => { if (e.target === lb) lb.close(); });
      lb.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1); });
      lb.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1); x0 = null; });
    }
    const io = 'IntersectionObserver' in window && new IntersectionObserver((es) => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { threshold: .15 });
    document.querySelectorAll('.reveal').forEach(el => io ? io.observe(el) : el.classList.add('in'));
  </script>
</body>
</html>
