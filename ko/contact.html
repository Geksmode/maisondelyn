  <main>
    <section class="page">
      <h1>문의</h1>
      <p class="lead">결혼식 이야기를 들려주세요. 48시간 이내에 가능한 일정과 견적을 보내 드립니다.</p>
      <!-- Remplacer VOTRE_ID par l'identifiant Formspree (formspree.io) pour recevoir les demandes par e-mail. -->
      <lyn-quote-form data-wip="문의 양식은 곧 열립니다. 그동안 Instagram으로 메시지를 보내 주세요." data-ok="감사합니다. 문의가 잘 접수되었습니다. 48시간 이내에 답변드리겠습니다." data-err="전송에 실패했습니다. 다시 시도하시거나 Instagram으로 메시지를 보내 주세요.">
      <form id="devis" class="reveal" action="https://formspree.io/f/VOTRE_ID" method="POST">
        <input type="hidden" name="langue" value="ko">
        <input type="text" name="_gotcha" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label>이름<input name="nom" required maxlength="80" autocomplete="name"></label>
        <label>이메일<input name="email" type="email" required maxlength="120" autocomplete="email"></label>
        <label>전화번호<input name="telephone" type="tel" required maxlength="30" autocomplete="tel" inputmode="tel"></label>
        <label>결혼식 날짜<input name="date" type="date" required></label>
        <label>준비 장소(도시)<input name="lieu" required maxlength="120"></label>
        <label>메이크업 인원<input name="personnes" type="number" min="1" max="30" value="1" required inputmode="numeric"></label>
        <label>서비스<select name="prestation"><option value="mariee">신부</option><option value="proches">가족·지인만</option><option value="evenement">이벤트 또는 촬영</option><option value="planner">웨딩플래너입니다</option></select></label>
        <label>원하는 스타일<select name="style"><option>아직 모르겠어요</option><option>내추럴</option><option>우아한</option><option>글램</option></select></label>
        <label class="full">메시지<textarea name="message" rows="3" maxlength="2000"></textarea></label>
        <button class="btn" type="submit"><span>보내기</span><svg aria-hidden="true" width="18" height="10" viewBox="0 0 18 10"><path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <p class="status" role="status" aria-live="polite"></p>
        <p class="fine">입력하신 정보는 문의에 답변하는 데에만 사용됩니다. <a href="confidentialite.html">자세히 보기</a>.</p>
      </form>
      </lyn-quote-form>
      <a class="btn ghost" href="https://www.instagram.com/maisondelyn_mua/"><span>또는 Instagram으로</span><svg aria-hidden="true" width="18" height="10" viewBox="0 0 18 10"><path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a>
    </section>
  </main>
