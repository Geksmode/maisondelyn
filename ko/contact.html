    <section class="page">
      <h1>문의</h1>
      <p class="lead">결혼식 이야기를 들려주세요. 48시간 이내에 가능한 일정과 견적을 보내 드립니다.</p>
      <!-- Remplacer VOTRE_ID par l'identifiant Formspree (formspree.io) pour recevoir les demandes par e-mail. -->
      <lyn-quote-form data-wip="문의 양식은 곧 열립니다. 그동안 Instagram으로 메시지를 보내 주세요." data-ok="감사합니다. 문의가 잘 접수되었습니다. 48시간 이내에 답변드리겠습니다." data-err="전송에 실패했습니다. 다시 시도하시거나 Instagram으로 메시지를 보내 주세요.">
      <form id="devis" class="reveal" action="https://formspree.io/f/VOTRE_ID" method="POST">
        <input type="hidden" name="langue" value="ko">
        <input type="text" name="_gotcha" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label>이름<input name="nom" required maxlength="80" autocomplete="name"></label>
        <label>이메일<input name="email" type="email" required maxlength="120" autocomplete="email"></label>
        <label>전화번호<input name="telephone" type="tel" required maxlength="30" autocomplete="tel" inputmode="tel"></label>
        <label>결혼식 날짜<input name="date" type="date" required></label>
        <label>준비 장소(도시)<input name="lieu" required maxlength="120"></label>
        <label>메이크업 인원<input name="personnes" type="number" min="1" max="30" value="1" required inputmode="numeric"></label>
        <label>서비스<select name="prestation"><option value="mariee">신부</option><option value="proches">가족·지인만</option><option value="evenement">이벤트 또는 촬영</option><option value="planner">웨딩플래너입니다</option></select></label>
        <label>원하는 스타일<select name="style"><option value="a-definir">아직 모르겠어요</option><option value="naturel">내추럴</option><option value="sophistique">우아한</option><option value="glamour">글램</option></select><lyn-quiz data-step="질문 {i}/3">
        <button type="button" class="quiz-link" data-open>내 스타일 찾기</button>
        <dialog class="quiz" aria-label="나에게 어울리는 메이크업은?">
          <button type="button" class="quiz-close" data-close aria-label="닫기">×</button>
          <p class="quiz-step"></p>
          <h2>나에게 어울리는 메이크업은?</h2>
          <fieldset data-q="0"><legend>평소 메이크업은…</legend><button type="button" data-v="naturel">거의 안 해요, 피부 표현 정도</button><button type="button" data-v="sophistique">눈매나 입술에 포인트</button><button type="button" data-v="glamour">화려한 게 좋아요</button></fieldset>
          <fieldset data-q="1" hidden><legend>결혼식 분위기는…</legend><button type="button" data-v="naturel">야외나 스몰 웨딩</button><button type="button" data-v="sophistique">우아하고 클래식하게</button><button type="button" data-v="glamour">밤새 이어지는 큰 파티</button></fieldset>
          <fieldset data-q="2" hidden><legend>가장 원하는 것은…</legend><button type="button" data-v="naturel">사진 속에서도 나다운 모습</button><button type="button" data-v="sophistique">맑고 세련된 느낌</button><button type="button" data-v="glamour">입장할 때 모두가 감탄하는 느낌</button></fieldset>
          <div class="result" data-result="naturel" hidden><img src="../img/naturel.jpg" srcset="../img/naturel-640.webp 640w, ../img/naturel-960.webp 960w, ../img/naturel-1280.webp 1280w, ../img/naturel-1440.webp 1440w" sizes="(max-width: 900px) 100vw, 50vw" width="1440" height="2560" data-full="../img/naturel-1440.webp" loading="lazy" decoding="async" alt=""><div><p class="kicker">나의 스타일</p><h3>내추럴</h3><p>맑고 균일한 피부, 한 듯 안 한 듯한 메이크업.</p><a class="btn" href="contact.html?style=naturel#devis"><span>이 스타일로 견적 문의하기</span><svg aria-hidden="true" width="18" height="10" viewBox="0 0 18 10"><path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a><button type="button" class="again" data-again>다시 하기</button></div></div>
          <div class="result" data-result="sophistique" hidden><img src="../img/mariee-tableau.jpg" srcset="../img/mariee-tableau-640.webp 640w, ../img/mariee-tableau-960.webp 960w, ../img/mariee-tableau-1280.webp 1280w, ../img/mariee-tableau-1920.webp 1920w, ../img/mariee-tableau-2560.webp 2560w" sizes="(max-width: 900px) 100vw, 50vw" width="2560" height="1440" data-full="../img/mariee-tableau-2560.webp" loading="lazy" decoding="async" alt=""><div><p class="kicker">나의 스타일</p><h3>우아한</h3><p>또렷한 눈매와 존재감 있는 입술, 그러면서도 나다운 모습.</p><a class="btn" href="contact.html?style=sophistique#devis"><span>이 스타일로 견적 문의하기</span><svg aria-hidden="true" width="18" height="10" viewBox="0 0 18 10"><path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a><button type="button" class="again" data-again>다시 하기</button></div></div>
          <div class="result" data-result="glamour" hidden><img src="../img/mariee-damas.jpg" srcset="../img/mariee-damas-640.webp 640w, ../img/mariee-damas-960.webp 960w, ../img/mariee-damas-1280.webp 1280w, ../img/mariee-damas-1920.webp 1920w, ../img/mariee-damas-2560.webp 2560w" sizes="(max-width: 900px) 100vw, 50vw" width="2560" height="1440" data-full="../img/mariee-damas-2560.webp" loading="lazy" decoding="async" alt=""><div><p class="kicker">나의 스타일</p><h3>글램</h3><p>저녁을 위한 더 많은 빛과 대비, 그리고 강렬함.</p><a class="btn" href="contact.html?style=glamour#devis"><span>이 스타일로 견적 문의하기</span><svg aria-hidden="true" width="18" height="10" viewBox="0 0 18 10"><path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a><button type="button" class="again" data-again>다시 하기</button></div></div>
        </dialog>
      </lyn-quiz></label>
        <label class="full">메시지<textarea name="message" rows="3" maxlength="2000"></textarea></label>
        <button class="btn" type="submit"><span>보내기</span><svg aria-hidden="true" width="18" height="10" viewBox="0 0 18 10"><path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <p class="status" role="status" aria-live="polite"></p>
        <p class="fine">입력하신 정보는 문의에 답변하는 데에만 사용됩니다. <a href="confidentialite.html">자세히 보기</a>.</p>
      </form>
      </lyn-quote-form>
      <a class="btn ghost" href="https://www.instagram.com/maisondelyn_mua/"><span>또는 Instagram으로</span><svg aria-hidden="true" width="18" height="10" viewBox="0 0 18 10"><path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a>
    </section>
